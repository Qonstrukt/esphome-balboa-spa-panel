# ---------------------------------------------------------------------------
# LVGL: 320x240. Nav bar 56 px at the bottom, content area 320x184 above it.
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - m5tough_display
  touchscreens:
    - m5tough_touch

  on_idle:
    - timeout: $idle_timeout
      then:
        - script.execute: screen_idle

  # Shared styles
  style_definitions:
    # Nav tab: a full-height, borderless zone; the active one gets an indicator bar
    - id: nav_style
      width: 80
      height: 56
      radius: 0
      bg_opa: TRANSP
      border_width: 0
      shadow_width: 0
      pad_all: 0
      text_color: $c_dim
    # Overview toggle button: outlined when off, filled when on (see `checked:` on each)
    - id: toggle_style
      width: 68
      height: 58
      radius: 10
      bg_opa: TRANSP
      border_width: 2
      border_color: $c_dim
      shadow_width: 0
      pad_all: 0
      text_color: $c_dim
    # Big +/- buttons on the control pages
    - id: big_button
      width: 70
      height: 112
      radius: 12
      bg_color: $c_tile
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      text_color: white
    # Active-tab indicator bar
    - id: nav_bar_style
      width: 60
      height: 4
      radius: 2
      bg_opa: COVER
      border_width: 0
      align: TOP_MID

  # Nav bar on every page
  top_layer:
    widgets:
      - container:
          id: nav_bar
          width: 320
          height: 56
          align: BOTTOM_MID
          bg_color: $c_bar
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          scrollbar_mode: "OFF"
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
          widgets:
            - button:
                id: nav_overview
                styles: nav_style
                widgets:
                  - container: { id: nav_overview_bar, styles: nav_bar_style, width: 60, height: 4, align: TOP_MID, bg_color: $c_cool }
                  - label: { id: nav_overview_icon, text: "\U000F02DC", text_font: mdi_40, text_color: $c_cool, align: CENTER, y: 2 }
                on_click:
                  - lvgl.page.show: overview_page
            - button:
                id: nav_weather
                styles: nav_style
                widgets:
                  - container: { id: nav_weather_bar, styles: nav_bar_style, width: 60, height: 4, align: TOP_MID, bg_color: $c_cool, hidden: true }
                  - label: { id: nav_weather_icon, text: "\U000F0595", text_font: mdi_40, align: CENTER, y: 2 }
                on_click:
                  - lvgl.page.show: weather_page
            - button:
                id: nav_spa
                styles: nav_style
                widgets:
                  - container: { id: nav_spa_bar, styles: nav_bar_style, width: 60, height: 4, align: TOP_MID, bg_color: $c_heat, hidden: true }
                  - label: { id: nav_spa_icon, text: "\U000F0238", text_font: mdi_40, align: CENTER, y: 2 }
                on_click:
                  - lvgl.page.show: spa_page
            - button:
                id: nav_hp
                styles: nav_style
                widgets:
                  - container: { id: nav_hp_bar, styles: nav_bar_style, width: 60, height: 4, align: TOP_MID, bg_color: $c_heat, hidden: true }
                  - label: { id: nav_hp_icon, text: "\U000F1A44", text_font: mdi_40, align: CENTER, y: 2 }
                on_click:
                  - lvgl.page.show: hp_page

  pages:
    # ------------------------------------------------------------------ overview
    - id: overview_page
      bg_color: black
      text_color: white
      on_load:
        - lvgl.label.update: { id: nav_overview_icon, text_color: $c_cool }
        - lvgl.label.update: { id: nav_weather_icon, text_color: $c_dim }
        - lvgl.label.update: { id: nav_spa_icon, text_color: $c_dim }
        - lvgl.label.update: { id: nav_hp_icon, text_color: $c_dim }
        - lvgl.widget.update: { id: nav_overview_bar, hidden: false }
        - lvgl.widget.update: { id: nav_weather_bar, hidden: true }
        - lvgl.widget.update: { id: nav_spa_bar, hidden: true }
        - lvgl.widget.update: { id: nav_hp_bar, hidden: true }
        - lvgl.widget.update: { id: nav_bar, hidden: false }
      widgets:
        # Clock, top left (Home Assistant time)
        - label: { id: clock_text, text: "--:--", text_font: montserrat_24, text_color: white, x: 12, y: 6 }

        # Water temperature arc, left, below the clock
        - arc:
            id: water_arc
            x: 10
            y: 40
            width: 150
            height: 150
            min_value: 200          # tenths of a degree
            max_value: 420
            value: 200
            arc_width: 14
            arc_color: $c_tile      # background track
            indicator:
              arc_width: 14
              arc_color: $c_cool
            knob:
              bg_opa: TRANSP
            adjustable: false
            widgets:
              - label:
                  id: water_text
                  text: "--.-°"
                  text_font: montserrat_36
                  align: CENTER
                  y: -6
              - label:
                  id: water_target_text
                  text: "target --.-°"
                  text_font: montserrat_12
                  text_color: $c_dim
                  align: CENTER
                  y: 22

        # Right column, x 176..312: four status icons on a 34 px grid (plain labels, not buttons)
        - label: { id: heater_icon, text: "\U000F0238", text_font: mdi_28, text_color: $c_dim, x: 176, y: 16, width: 34, text_align: CENTER }
        - label: { id: hp_icon,     text: "\U000F1A44", text_font: mdi_28, text_color: $c_dim, x: 210, y: 16, width: 34, text_align: CENTER }
        - label: { id: circ_icon,   text: "\U000F006A", text_font: mdi_28, text_color: $c_dim, x: 244, y: 16, width: 34, text_align: CENTER }
        - label: { id: wifi_icon,   text: "\U000F05AA", text_font: mdi_28, text_color: $c_alert, x: 278, y: 16, width: 34, text_align: CENTER }
        - container: { x: 176, y: 54, width: 136, height: 1, bg_color: $c_tile, bg_opa: COVER, border_width: 0, radius: 0 }

        # Weather: condition icon and outside temperature, centred together
        - container:
            x: 176
            y: 60
            width: 136
            height: 44
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 10
            widgets:
              - label: { id: weather_icon, text: "\U000F0590", text_font: mdi_40, text_color: white }
              - label: { id: outside_text, text: "--°", text_font: montserrat_32, text_color: white }

        # The only buttons on this page
        - button:
            id: jets_button
            styles: toggle_style
            x: 174
            y: 114
            checkable: true
            checked: { bg_color: $c_cool, bg_opa: COVER, border_color: $c_cool, text_color: black }
            widgets:
              - label: { text: "\U000F12E5", text_font: mdi_40, align: CENTER }
            on_click:
              - switch.toggle: balboa_jets
        - button:
            id: lights_button
            styles: toggle_style
            x: 248
            y: 114
            checkable: true
            checked: { bg_color: $c_cool, bg_opa: COVER, border_color: $c_cool, text_color: black }
            widgets:
              - label: { text: "\U000F0335", text_font: mdi_40, align: CENTER }
            on_click:
              - light.toggle: balboa_lights

    # ------------------------------------------------------------------ weather
    - id: weather_page
      bg_color: black
      text_color: white
      on_load:
        - lvgl.label.update: { id: nav_overview_icon, text_color: $c_dim }
        - lvgl.label.update: { id: nav_weather_icon, text_color: $c_cool }
        - lvgl.label.update: { id: nav_spa_icon, text_color: $c_dim }
        - lvgl.label.update: { id: nav_hp_icon, text_color: $c_dim }
        - lvgl.widget.update: { id: nav_overview_bar, hidden: true }
        - lvgl.widget.update: { id: nav_weather_bar, hidden: false }
        - lvgl.widget.update: { id: nav_spa_bar, hidden: true }
        - lvgl.widget.update: { id: nav_hp_bar, hidden: true }
        - lvgl.widget.update: { id: nav_bar, hidden: false }
      widgets:
        # Now: icon, temperature and condition name (weather_state / outside_temp),
        # wind and humidity stacked on the right (update_wind_text / humidity)
        # One row centred on y 34: icon 6..62, temperature 8..61, and a right aligned
        # stack of condition name, wind and humidity (three 16 px lines, 6..71)
        - label: { id: wx_now_icon, text: "\U000F0590", text_font: mdi_56, text_color: white, x: 12, y: 6 }
        - label: { id: wx_now_temp, text: "--°", text_font: montserrat_48, x: 78, y: 8 }
        - label: { id: wx_now_text, text: "--", text_font: montserrat_16, text_color: $c_dim, align: TOP_RIGHT, x: -12, y: 6, text_align: RIGHT }
        - label: { id: wx_wind_text, text: "-- ${wind_unit}", text_font: montserrat_16, text_color: $c_dim, align: TOP_RIGHT, x: -12, y: 29, text_align: RIGHT }
        - label: { id: wx_hum_text, text: "--% humidity", text_font: montserrat_16, text_color: $c_dim, align: TOP_RIGHT, x: -12, y: 52, text_align: RIGHT }
        # Next six hours: columns of time, icon, temperature, rain chance (forecast_*)
        - container:
            x: 8
            y: 88
            width: 304
            height: 90
            radius: 8
            bg_color: $c_tile
            bg_opa: COVER
            border_width: 0
            pad_all: 4
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              - container:
                  width: 46
                  height: 82
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
