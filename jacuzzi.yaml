        - lvgl.widget.update: { id: nav_overview_bar, hidden: true }
        - lvgl.widget.update: { id: nav_weather_bar, hidden: true }
        - lvgl.widget.update: { id: nav_spa_bar, hidden: true }
        - lvgl.widget.update: { id: nav_hp_bar, hidden: false }
        - lvgl.widget.update: { id: nav_bar, hidden: false }
      widgets:
        - button:
            styles: big_button
            x: 8
            y: 12
            widgets:
              - label: { text: "\U000F0140", text_font: mdi_40, align: CENTER }
            on_click:
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: $heatpump_entity
                    temperature: !lambda return to_string(id(hp_target).state - 1);
        - button:
            styles: big_button
            x: 242
            y: 12
            widgets:
              - label: { text: "\U000F0143", text_font: mdi_40, align: CENTER }
            on_click:
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: $heatpump_entity
                    temperature: !lambda return to_string(id(hp_target).state + 1);
        - label: { text: "HEAT PUMP", text_font: montserrat_20, text_color: $c_dim, align: TOP_MID, y: 14 }
        - label: { id: hp_target_text, text: "--°", text_font: montserrat_48, align: TOP_MID, y: 42 }
        - label: { id: hp_current_text, text: "now --°", text_font: montserrat_20, text_color: $c_dim, align: TOP_MID, y: 98 }
        - container:
            x: 8
            y: 132
            width: 304
            height: 44
            radius: 8
            bg_color: $c_tile
            bg_opa: COVER
            border_width: 0
            pad_all: 5
            pad_left: 12
            pad_right: 12
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
            widgets:
              - label: { text: "\U000F1A44", text_font: mdi_28, text_color: $c_heat }
              - label: { id: hp_state_text, text: "off", text_font: montserrat_20, text_color: white }
              - button:
                  id: hp_power_button
                  width: 44
                  height: 34
                  radius: 8
                  bg_color: $c_bar
                  bg_opa: COVER
                  border_width: 0
                  shadow_width: 0
                  text_color: $c_dim
                  checkable: true
                  checked: { bg_color: $c_heat, text_color: white }
                  widgets:
                    - label: { text: "\U000F0425", text_font: mdi_28, align: CENTER }
                  on_click:
                    - if:
                        condition:
                          lambda: return id(hp_state).state == "heat";
                        then:
                          - homeassistant.action:
                              action: climate.turn_off
                              data: { entity_id: $heatpump_entity }
                        else:
                          - homeassistant.action:
                              action: climate.turn_on
                              data: { entity_id: $heatpump_entity }

    # ------------------------------------------------------------------ lock
    # Shown when the spa is parked and the screen has been idle. Dry weather: a tap
    # unlocks. Rain or snow: only a long press unlocks, so drops on the glass do nothing.
    - id: lock_page
      bg_color: black
      text_color: white
      widgets:
        - button:
            id: unlock_button
            width: 200
            height: 120
            align: CENTER
            radius: 16
            bg_color: $c_tile
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            text_color: $c_dim
            widgets:
              - label: { text: "\U000F033E", text_font: mdi_40, align: CENTER, y: -14 }
              - label: { id: unlock_hint, text: "tap to unlock", text_font: montserrat_14, align: BOTTOM_MID, y: -10 }
            on_long_press:
              - script.execute: screen_unlock
            on_short_click:
              - if:
                  condition:
                    lambda: |-
                      auto w = id(weather_state).state;
                      return w != "rainy" && w != "pouring" && w != "snowy" && w != "snowy-rainy";
                  then:
                    - script.execute: screen_unlock
                  else:
                    - lvgl.label.update: { id: unlock_hint, text: "hold to unlock" }
