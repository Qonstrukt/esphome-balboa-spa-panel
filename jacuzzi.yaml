                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label: { id: fc_time_4, text: "--:--", text_font: montserrat_12, text_color: $c_dim }
                    - label: { id: fc_icon_4, text: "\U000F0590", text_font: mdi_28, text_color: $c_dim }
