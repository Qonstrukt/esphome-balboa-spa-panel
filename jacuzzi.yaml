esphome:
  name: $hostname
  comment: $friendly_name
  friendly_name: $friendly_name

# Hardware: M5Stack Tough. Board, AXP192 power, display, touch and backlight come
# from the m5tough package (https://github.com/Qonstrukt/esphome-m5tough).
packages:
  m5tough: github://Qonstrukt/esphome-m5tough/m5tough.yaml@main
  m5tough_speaker: github://Qonstrukt/esphome-m5tough/m5tough-speaker.yaml@main

substitutions:
  hostname: jacuzzi
  friendly_name: "Balboa Jacuzzi"
  
  weather_entity: weather.ulenpas_weather
  forecast_entity: sensor.ulenpas_forecast_hourly   # template sensor in HA, see ha-forecast-sensor.yaml
  wind_unit: "km/h"                                  # wind_speed_unit of the weather entity
  heatpump_entity: climate.w_eau_wsh_005

  # Colours, shared by the arc, indicators, buttons and nav bar
  c_cool: "0x3399ff"
  c_heat: "0xf44336"
  c_tile: "0x1c1c1c"
  c_bar: "0x111111"
  c_dim: "0x8a8a8a"
  c_alert: "0xe05252"

  # Screen behaviour
  idle_timeout: 120s        # no touch for this long -> dim (in use) or lock + backlight off (parked)
  in_use_above: "30.0"      # spa counts as "in use" when the heater target is above this (°C)
  hp_circ_delay: 90s        # circulation must run this long before the heat pump is switched on

logger:
  # INFO keeps warnings, errors and the spa clock resync line; DEBUG would write
  # several lines per Balboa status frame to the serial port and stall the loop.
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 2min
  min_auth_mode: WPA2
  output_power: 20dB
  on_connect:
    - lvgl.label.update: { id: wifi_icon, text: "\U000F05A9", text_color: $c_dim }
  on_disconnect:
    - lvgl.label.update: { id: wifi_icon, text: "\U000F05AA", text_color: $c_alert }
  
  ap:
    ssid: "$friendly_name Hotspot"
    password: !secret ap_wifi_password

captive_portal:

ota:
  - platform: esphome
    encryption:

api:
  encryption:
    key: !secret jacuzzi_api_key

# Exposes the last reset reason to Home Assistant (e.g. "Brownout", "Power On", "Software Reset")
debug:
  update_interval: 30s

# ---------------------------------------------------------------------------
# Screen state: in use (target > $in_use_above) -> idle dims to 10 %;
# parked -> idle shows the lock page and switches the backlight off.
# Touch restores the saved brightness from either state. In rain the lock
# page needs a long press; otherwise a tap unlocks.
# ---------------------------------------------------------------------------
globals:
  - id: spa_in_use
    type: bool
    initial_value: "false"
  - id: last_spa_time_sync   # millis() of the last clock sync sent to the spa, 0 = never
    type: uint32_t
    initial_value: "0"
  - id: screen_locked
    type: bool
    initial_value: "false"
  - id: screen_dimmed
    type: bool
    initial_value: "false"

script:
  # Backlight off, LVGL paused with snow against image persistence.
  - id: screen_off
    then:
      - lvgl.pause:
          show_snow: true
      - light.turn_off: m5tough_backlight_light
      - lambda: id(screen_dimmed) = false;

  # 10 %: written to the output directly, so the light keeps its saved brightness.
  - id: screen_dim
    then:
      - output.set_level:
          id: m5tough_backlight
          level: 10%
      - lambda: id(screen_dimmed) = true;

  # Resume LVGL and restore the saved brightness.
  - id: screen_on
    then:
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lambda: id(screen_dimmed) = false;
      - light.turn_on: m5tough_backlight_light

  # Lock: show the lock page without the nav bar, then backlight off.
  - id: screen_lock
    then:
      - lambda: id(screen_locked) = true;
      - lvgl.widget.update: { id: nav_bar, hidden: true }
      - lvgl.page.show: lock_page
      - script.execute: screen_off

  # Unlock: back to the overview with the nav bar.
  - id: screen_unlock
    then:
      - lambda: id(screen_locked) = false;
      - lvgl.widget.update: { id: nav_bar, hidden: false }
      - lvgl.page.show: overview_page

  # What idle means right now: dim while in use, lock when parked.
  - id: screen_idle
    then:
      - if:
          condition:
            lambda: return id(spa_in_use);
          then:
            - script.execute: screen_dim
          else:
            - script.execute: screen_lock

  # Heat pump follows the circulation pump (when hp_auto is on): started after
  # the pump has run for $hp_circ_delay, stopped as soon as the pump stops.
  - id: hp_circ_start
    mode: restart
    then:
      - delay: $hp_circ_delay
      - if:
          condition:
            and:
              - switch.is_on: hp_auto
              - binary_sensor.is_on: spa_circulation
              - lambda: return id(hp_state).state != "heat";
          then:
            - logger.log: { level: INFO, tag: hp_auto, format: "circulation running for ${hp_circ_delay}: heat pump on" }
            - homeassistant.action:
                action: climate.turn_on
                data: { entity_id: $heatpump_entity }
  - id: hp_circ_stop
    then:
      - script.stop: hp_circ_start
      - if:
          condition:
            and:
              - switch.is_on: hp_auto
              - lambda: return id(hp_state).state == "heat";
          then:
            - logger.log: { level: INFO, tag: hp_auto, format: "circulation stopped: heat pump off" }
            - homeassistant.action:
                action: climate.turn_off
                data: { entity_id: $heatpump_entity }

  # Spa clock: compare the time the spa reports with Home Assistant time and
  # resync when they differ by more than a minute (power loss resets the spa
  # clock, and the spa knows nothing about daylight saving). Runs every minute
  # at :30 and right after a time sync; at most one resync per 5 minutes.
  - id: spa_time_check
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          auto *st = id(spa).get_current_state();
          if (!id(spa).is_communicating() || std::isnan(st->current_temp)) return;  // no status from the spa yet
          int spa_min = st->hour * 60 + st->minutes;
          int ha_min = now.hour * 60 + now.minute;
          int diff = abs(spa_min - ha_min);
          if (diff > 720) diff = 1440 - diff;
          if (diff <= 1) return;
          if (id(last_spa_time_sync) != 0 && millis() - id(last_spa_time_sync) < 300000) return;
          ESP_LOGI("spa_time", "Spa clock %02d:%02d, Home Assistant %02d:%02d: syncing", st->hour, st->minutes, now.hour, now.minute);
          id(last_spa_time_sync) = millis();
          id(sync_spa_time).press();
  # Wind label on the weather page, from wind_speed and wind_bearing
  - id: update_wind_text
    then:
      - lambda: |-
          static const char *dirs[] = { "N", "NE", "E", "SE", "S", "SW", "W", "NW" };
          float spd = id(wind_speed).state, brg = id(wind_bearing).state;
          char buf[32];
          if (std::isnan(spd)) {
            snprintf(buf, sizeof(buf), "-- ${wind_unit}");
          } else if (std::isnan(brg)) {
            snprintf(buf, sizeof(buf), "%.0f ${wind_unit}", spd);
          } else {
            int d = ((int) ((brg + 22.5f) / 45.0f)) % 8;
            snprintf(buf, sizeof(buf), "%.0f ${wind_unit} %s", spd, dirs[d]);
          }
          lv_label_set_text(id(wx_wind_text), buf);
  # Countdown started when the target drops below the in-use threshold.
  - id: blank_later
    mode: restart
    then:
      - delay: $idle_timeout
      - script.execute: screen_idle

external_components:
  - source: github://brianfeucht/esphome-balboa-spa
    components: [balboa_spa]
     
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lvgl.label.update:
          id: clock_text
          text: !lambda return id(ha_time).now().strftime("%H:%M");
      - script.execute: spa_time_check
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: clock_text
              text: !lambda return id(ha_time).now().strftime("%H:%M");
      - seconds: 30
        then:
          - script.execute: spa_time_check

uart:
  id: spa_uart_bus
  # External M5 RS485 unit (U034) on Port C (blue, the UART port): Tough TX GPIO14 -> unit yellow (RX),
  # Tough RX GPIO13 <- unit white (TX). The unit's 12 V input powers the Tough through the Grove 5 V pin.
  # The Tough's internal RS485 port (TX GPIO19 / RX GPIO27) is not used: its 120 ohm termination
  # (R7 on the Ext Board) collapses the passively driven 1-bits of the auto-direction circuit.
  # Port A would be GPIO32 (TX) / GPIO33 (RX).
  tx_pin: GPIO14
  rx_pin: GPIO13
  data_bits: 8
  parity: NONE
  stop_bits: 1
  baud_rate: 115200
  rx_buffer_size: 8192   # Balboa bus is busy at 115200 (~11.5 kB/s); 8 kB covers a ~700 ms loop stall
  
balboa_spa:
  id: spa
  spa_temp_scale: C
  # No client_id override: the spa assigns IDs (0x10 upwards) to each client that asks.
  # A fixed ID collides with the Balboa WiFi module after a power cycle, jamming the bus.

light:
  - platform: balboa_spa
    balboa_spa_id: spa
    light:
      id: balboa_lights
      name: Lights
      on_state:
        - lvgl.widget.update:
            id: lights_button
            state:
              checked: !lambda return id(balboa_lights).current_values.is_on();
   
switch:
  # Heat pump automation on/off (manual control stays possible from HA and the panel)
  - platform: template
    id: hp_auto
    name: "Heat Pump Follows Circulation"
    icon: mdi:heat-pump-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: balboa_spa
    balboa_spa_id: spa
    jet1:
      id: balboa_jets
      name: Jets
      max_toggle_attempts: 5  # Optional: max attempts to reach desired state (default: 5)
      discard_updates: 5      # Optional: state updates to ignore after each toggle (default: 20)
      on_state:
        - lvgl.widget.update:
            id: jets_button
            state:
              checked: !lambda return x;

climate:
  - platform: balboa_spa
    id: balboa_spa_climate
    balboa_spa_id: spa
    name: "Spa Thermostat"
    visual:
      min_temperature: 26 °C
      max_temperature: 40 °C
      temperature_step: 0.5 °C
    on_state:
      - lvgl.arc.update:
          id: water_arc
          value: !lambda return (int) lroundf(id(balboa_spa_climate).current_temperature * 10);
      - lvgl.label.update:
          id: water_text
          text:
            format: "%.1f°"
            args: [ 'id(balboa_spa_climate).current_temperature' ]
      - lvgl.label.update:
          id: water_target_text
          text:
            format: "target %.1f°"
            args: [ 'id(balboa_spa_climate).target_temperature' ]
      - lvgl.label.update:
          id: spa_target_text
          text:
            format: "%.1f°"
            args: [ 'id(balboa_spa_climate).target_temperature' ]
      - lvgl.label.update:
          id: spa_current_text
          text:
            format: "now %.1f°"
            args: [ 'id(balboa_spa_climate).current_temperature' ]
      # In-use rule: target above $in_use_above keeps the screen on (dimmed when idle)
      - lambda: |-
          bool in_use = id(balboa_spa_climate).target_temperature > ${in_use_above}f;
          if (in_use && !id(spa_in_use)) {
            id(spa_in_use) = true;
            if (id(screen_locked)) id(screen_unlock).execute();
            id(screen_on).execute();
          } else if (!in_use && id(spa_in_use)) {
            id(spa_in_use) = false;
            id(blank_later).execute();
          }

sensor:
  # Diagnostics: loop stalls longer than ~180 ms overflow the 2048-byte UART buffer and show up as CRC errors
  - platform: debug
    loop_time:
      name: "Loop Time"
    free:
      name: "Heap Free"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: balboa_spa
    balboa_spa_id: spa
    fault_code:
      name: Fault Code
    fault_total_entries:
      name: Fault Total Entries
    fault_current_entry:
      name: Fault Current Entry
    fault_days_ago:
      name: Fault Days Ago

  - platform: homeassistant
    id: outside_temp
    entity_id: $weather_entity
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: outside_text
          text:
            format: "%.0f°"
            args: [ 'x' ]
      - lvgl.label.update:
          id: wx_now_temp
          text:
            format: "%.0f°"
            args: [ 'x' ]

  - platform: homeassistant
    id: wind_speed
    entity_id: $weather_entity
    attribute: wind_speed
    on_value:
      - script.execute: update_wind_text
  - platform: homeassistant
    id: wind_bearing
    entity_id: $weather_entity
    attribute: wind_bearing
    on_value:
      - script.execute: update_wind_text
  - platform: homeassistant
    id: humidity
    entity_id: $weather_entity
    attribute: humidity
    on_value:
      - lvgl.label.update:
          id: wx_hum_text
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.0f%% humidity", x);
            return std::string(buf);

  - platform: homeassistant
    id: hp_current
    entity_id: $heatpump_entity
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: hp_current_text
          text:
            format: "now %.0f°"
            args: [ 'x' ]

  - platform: homeassistant
    id: hp_target
    entity_id: $heatpump_entity
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: hp_target_text
          text:
            format: "%.0f°"
            args: [ 'x' ]
      
binary_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    blower:
      name: Blower
      device_class: running
    highrange:
      name: High Range
      device_class: power
      on_state:
        - lvgl.label.update:
            id: spa_range_text
            text: !lambda |-
              return std::string(x ? "HIGH" : "LOW");

    circulation:
      id: spa_circulation
      name: Circulation Pump
      device_class: running
      on_state:
        - lvgl.label.update:
            id: circ_icon
            text_color: !lambda |-
              return x ? lv_color_hex($c_cool) : lv_color_hex($c_dim);
        - if:
            condition:
              lambda: return x;
            then:
              - script.execute: hp_circ_start
            else:
              - script.execute: hp_circ_stop
              
    restmode:
      name: Rest Mode
      device_class: power
      
    heatstate:
      name: Heat State
      device_class: heat
      on_state:
        - lvgl.label.update:
            id: heater_icon
            text_color: !lambda |-
              return x ? lv_color_hex($c_heat) : lv_color_hex($c_dim);
        - lvgl.arc.update:
            id: water_arc
            indicator:
              arc_color: !lambda |-
                return x ? lv_color_hex($c_heat) : lv_color_hex($c_cool);
        - lvgl.label.update:
            id: spa_state_text
            text: !lambda |-
              return std::string(x ? "heating" : "idle");
              
    connected:
      name: Connected
      
    filter1_running:
      name: "Filter 1 Running"
      device_class: running      

text:
  - platform: balboa_spa
    balboa_spa_id: spa
    spa_time:
      name: "Set Spa Time"
      mode: TEXT
    filter1_start_time:
      name: "Set Filter 1 Start Time"
      mode: TEXT
    filter1_duration:
      name: "Set Filter 1 Duration"
      mode: TEXT
    # filter2_start_time:
    #   name: "Set Filter 2 Start Time"
    #   mode: TEXT
    # filter2_duration:
    #   name: "Set Filter 2 Duration"
    #   mode: TEXT

text_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    spa_time:
      name: "Spa Time"
    filter1_config:
      name: "Filter 1 Config"
    # filter2_config:
    #   name: "Filter 2 Config"
    fault_message:
      name: "Fault Message"
    fault_log_time:
      name: "Fault Log Time"
    reminder:
      name: "Reminder"
    component_version:
      name: "Component Version"

  - platform: homeassistant
    id: hp_state
    entity_id: $heatpump_entity
    on_value:
      - if:
          condition:
            lambda: return x == "heat";
          then:
            - lvgl.label.update: { id: hp_icon, text_color: $c_heat }
            - lvgl.widget.update: { id: hp_power_button, state: { checked: true } }
            - lvgl.label.update: { id: hp_state_text, text: "heating" }
          else:
            - lvgl.label.update: { id: hp_icon, text_color: $c_dim }
            - lvgl.widget.update: { id: hp_power_button, state: { checked: false } }
            - lvgl.label.update:
                id: hp_state_text
                text: !lambda return x;

  # Weather condition -> MDI glyph. Home Assistant condition names:
  # https://www.home-assistant.io/integrations/weather/#condition-mapping
  # Drives the overview icon and the "now" block of the weather page.
  - platform: homeassistant
    id: weather_state
    entity_id: $weather_entity
    on_value:
      - lambda: |-
          auto glyph = [](const std::string &c) -> const char * {
            if (c == "sunny")           return "\U000F0599";  // weather-sunny
            if (c == "clear-night")     return "\U000F0594";  // weather-night
            if (c == "partlycloudy")    return "\U000F0595";  // weather-partly-cloudy
            if (c == "cloudy")          return "\U000F0590";  // weather-cloudy
            if (c == "rainy")           return "\U000F0597";  // weather-rainy
            if (c == "pouring")         return "\U000F0596";  // weather-pouring
            if (c == "lightning")       return "\U000F0593";  // weather-lightning
            if (c == "lightning-rainy") return "\U000F067E";  // weather-lightning-rainy
            if (c == "snowy")           return "\U000F0598";  // weather-snowy
            if (c == "snowy-rainy")     return "\U000F067F";  // weather-snowy-rainy
            if (c == "hail")            return "\U000F0592";  // weather-hail
            if (c == "fog")             return "\U000F0591";  // weather-fog
            if (c == "windy")           return "\U000F059D";  // weather-windy
            if (c == "windy-variant")   return "\U000F059E";  // weather-windy-variant
            if (c == "exceptional")     return "\U000F05D6";  // alert-circle-outline
            return "\U000F0590";
          };
          lv_label_set_text(id(weather_icon), glyph(x));
          lv_label_set_text(id(wx_now_icon), glyph(x));
          // readable condition name: "partlycloudy" -> "partly cloudy", "snowy-rainy" -> "snowy rainy"
          std::string name = (x == "partlycloudy") ? std::string("partly cloudy") : x;
          for (auto &ch : name) if (ch == '-') ch = ' ';
          lv_label_set_text(id(wx_now_text), name.c_str());

  # Hourly forecast: six entries as space separated lists in the attributes of
  # a trigger based template sensor in Home Assistant (see ha-forecast-sensor.yaml).
  - platform: homeassistant
    id: forecast_hours
    entity_id: $forecast_entity
    attribute: hours
    on_value:
      - lambda: |-
          lv_obj_t *labels[6] = { id(fc_time_0), id(fc_time_1), id(fc_time_2), id(fc_time_3), id(fc_time_4), id(fc_time_5) };
          size_t start = 0;
          for (int i = 0; i < 6; i++) {
            size_t end = x.find(' ', start);
            std::string part = start < x.size() ? x.substr(start, end == std::string::npos ? std::string::npos : end - start) : "";
            lv_label_set_text(labels[i], part.empty() ? "--:--" : (part + ":00").c_str());
            start = (end == std::string::npos) ? x.size() : end + 1;
          }

  - platform: homeassistant
    id: forecast_conditions
    entity_id: $forecast_entity
    attribute: conditions
    on_value:
      - lambda: |-
          auto glyph = [](const std::string &c) -> const char * {
            if (c == "sunny")           return "\U000F0599";
            if (c == "clear-night")     return "\U000F0594";
            if (c == "partlycloudy")    return "\U000F0595";
            if (c == "cloudy")          return "\U000F0590";
            if (c == "rainy")           return "\U000F0597";
            if (c == "pouring")         return "\U000F0596";
            if (c == "lightning")       return "\U000F0593";
            if (c == "lightning-rainy") return "\U000F067E";
            if (c == "snowy")           return "\U000F0598";
            if (c == "snowy-rainy")     return "\U000F067F";
            if (c == "hail")            return "\U000F0592";
            if (c == "fog")             return "\U000F0591";
            if (c == "windy")           return "\U000F059D";
            if (c == "windy-variant")   return "\U000F059E";
            if (c == "exceptional")     return "\U000F05D6";
            return "\U000F0590";
          };
          lv_obj_t *labels[6] = { id(fc_icon_0), id(fc_icon_1), id(fc_icon_2), id(fc_icon_3), id(fc_icon_4), id(fc_icon_5) };
          size_t start = 0;
          for (int i = 0; i < 6; i++) {
            size_t end = x.find(' ', start);
            std::string part = start < x.size() ? x.substr(start, end == std::string::npos ? std::string::npos : end - start) : "";
            lv_label_set_text(labels[i], glyph(part));
            start = (end == std::string::npos) ? x.size() : end + 1;
          }

  - platform: homeassistant
    id: forecast_temps
    entity_id: $forecast_entity
    attribute: temps
    on_value:
      - lambda: |-
          lv_obj_t *labels[6] = { id(fc_temp_0), id(fc_temp_1), id(fc_temp_2), id(fc_temp_3), id(fc_temp_4), id(fc_temp_5) };
          size_t start = 0;
          for (int i = 0; i < 6; i++) {
            size_t end = x.find(' ', start);
            std::string part = start < x.size() ? x.substr(start, end == std::string::npos ? std::string::npos : end - start) : "";
            if (part.empty()) {
              lv_label_set_text(labels[i], "--°");
            } else {
              char buf[8];
              snprintf(buf, sizeof(buf), "%.0f°", atof(part.c_str()));
              lv_label_set_text(labels[i], buf);
            }
            start = (end == std::string::npos) ? x.size() : end + 1;
          }

  - platform: homeassistant
    id: forecast_rain
    entity_id: $forecast_entity
    attribute: rain
    on_value:
      - lambda: |-
          lv_obj_t *labels[6] = { id(fc_rain_0), id(fc_rain_1), id(fc_rain_2), id(fc_rain_3), id(fc_rain_4), id(fc_rain_5) };
          size_t start = 0;
          for (int i = 0; i < 6; i++) {
            size_t end = x.find(' ', start);
            std::string part = start < x.size() ? x.substr(start, end == std::string::npos ? std::string::npos : end - start) : "";
            int pct = part.empty() ? 0 : atoi(part.c_str());
            if (pct <= 0) {
              lv_label_set_text(labels[i], " ");   // keep the row height, show nothing
            } else {
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", pct);
              lv_label_set_text(labels[i], buf);
            }
            start = (end == std::string::npos) ? x.size() : end + 1;
          }

  - platform: debug
    reset_reason:
      name: "Reset Reason"

  - platform: version
    name: 'ESPHome Version'

  - platform: wifi_info
    ip_address:
      name: 'IP'
    ssid:
      name: 'SSID'
    bssid:
      name: 'BSSID'
    mac_address:
      name: "MAC"

  - platform: template
    name: 'Friendly Name'
    icon: 'mdi:information-outline'
    lambda: |-
      return {"$friendly_name"};

button:
  - platform: balboa_spa
    balboa_spa_id: spa
    sync_time:
      id: sync_spa_time
      name: "Sync Spa Time"
    # disable_filter2:
    #   name: "Disable Filter 2"
    request_fault_log:
      name: "Request Fault Log"
    clear_reminder:
      name: "Clear Reminder"
  
# Touch while blanked or dimmed: back to the saved brightness (touch itself is from the package)
touchscreen:
  - id: !extend m5tough_touch
    on_release:
      - if:
          condition:
            or:
              - lvgl.is_paused:
              - lambda: return id(screen_dimmed);
          then:
            - script.execute: screen_on

