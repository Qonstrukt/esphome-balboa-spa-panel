                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label: { id: fc_time_3, text: "--:--", text_font: montserrat_12, text_color: $c_dim }
                    - label: { id: fc_icon_3, text: "\U000F0590", text_font: mdi_28, text_color: $c_dim }
                    - label: { id: fc_temp_3, text: "--°", text_font: montserrat_18 }
